    function ConflictAlert({ conflict, onResolve, onDismiss }) {
      if (!conflict) return null;
      return (

                <span>Xung đột lịch học:</span>
                <span className="font-normal text-red-700">
                  Lớp <strong>{conflict.incomingCourse.code}</strong> bị trùng ca Thứ {conflict.incomingCourse.day} ({conflict.incomingCourse.scheduleText}) với môn <strong>{conflict.existingCourse.code}</strong> đã có trên lịch.
                </span>
              </p>
            </div>
          </div>
          <div className="flex items-center space-x-2">
            <button 
              onClick={onResolve} 
              className="px-3 py-1 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-md shadow-xs transition flex items-center space-x-1"
            >

              <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
            </button>
            <button onClick={onDismiss} className="text-red-400 hover:text-red-700 text-sm p-1">
              <i data-lucide="x" className="w-4 h-4"></i>
            </button>
          </div>
        </div>
      );
    }

    // ==================== COMPONENT: COURSE CARD ====================
    function CourseCard({ course, isSelected, isClashing, conflictingCourse, onAdd, onRemove, onOpenDetail, onHoverEnter, onHoverLeave }) {
      const isIneligible = course.status === "ineligible";

      // Canonical Priority: Selected > Ineligible > Conflict > Available
      const visualState = isSelected
        ? "selected"
        : isIneligible
        ? "ineligible"
        : isClashing
        ? "conflict"
        : "available";

      const containerClasses = {
        selected: "bg-blue-50/90 border-2 border-blue-500 shadow-sm ring-1 ring-blue-500/20",
        ineligible: "bg-slate-100/70 border border-slate-300 opacity-80 cursor-default",
        conflict: "bg-red-50/70 border-2 border-red-400 hover:border-red-500 shadow-2xs",
        available: "bg-white border border-slate-200 hover:border-blue-400 hover:shadow-md cursor-pointer"
      };

      const stateBadge = {
        selected: { text: "Đã chọn", icon: "check-circle-2", bg: "bg-blue-100 text-blue-800 border-blue-200" },
        ineligible: { text: "Chưa đủ điều kiện", icon: "lock", bg: "bg-slate-200 text-slate-700 border-slate-300" },
        conflict: { text: "Trùng lịch TKB", icon: "alert-triangle", bg: "bg-red-100 text-red-800 border-red-200" },
        available: { text: "Sẵn sàng", icon: "check", bg: "bg-emerald-50 text-emerald-800 border-emerald-200" }
      };

      return (
        <div 
          role="button"
          tabIndex={0}
          aria-label={`Môn học ${course.name}, Mã ${course.code}, Trạng thái ${stateBadge[visualState].text}`}
          onClick={() => onOpenDetail(course)}
          onKeyDown={(e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              onOpenDetail(course);
            }
          }}
          onMouseEnter={() => onHoverEnter(course)}
          onMouseLeave={onHoverLeave}
          className={`p-3.5 rounded-xl transition-all duration-150 space-y-2.5 relative select-none focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-1 ${containerClasses[visualState]}`}
        >
          <div className="flex justify-between items-start gap-2">
            <div className="flex items-center flex-wrap gap-1.5">
              <span className={`font-mono font-bold text-[11px] px-2 py-0.5 rounded shadow-2xs ${
                visualState === "selected"

    // ==================== COMPONENT: COURSE EXPLORER ====================
    function CourseExplorer({ courses, selectedIds, onAdd, onRemove, onOpenDetail, onHoverEnter, onHoverLeave }) {
      const [search, setSearch] = useState("");
      const [faculty, setFaculty] = useState("ALL");
      const [shift, setShift] = useState("ALL");
      const [day, setDay] = useState("ALL");
      const [maxCredits, setMaxCredits] = useState(4);
      const [onlyNonConflicting, setOnlyNonConflicting] = useState(false);

      const removeTones = (str) => {
        return (str || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/Đ/g, "D");
      };

      const selectedCourses = useMemo(() => {
        return courses.filter(c => selectedIds.includes(c.id));
      }, [courses, selectedIds]);

      const checkIntervalConflict = (a, b) => {
        if (a.id === b.id) return false;
        if (a.day !== b.day) return false;
        if (a.startPeriod != null && a.endPeriod != null && b.startPeriod != null && b.endPeriod != null) {
          return a.startPeriod <= b.endPeriod && a.endPeriod >= b.startPeriod;
        }
        if (a.periodSlot && b.periodSlot) {
          return a.periodSlot === b.periodSlot;
        }
        return a.periodText === b.periodText;
      };

      const maxPossibleCredits = useMemo(() => {
        return Math.max(4, ...courses.map(c => c.credits || 0));
      }, [courses]);

      const filteredCourses = useMemo(() => {
        const qRaw = search.trim().toLowerCase();
        const qNorm = removeTones(qRaw);

        return courses.filter(c => {
          // Instant search (<100ms)
          if (qRaw) {
            const code = (c.code || "").toLowerCase();
            const name = (c.name || "").toLowerCase();
            const lecturer = (c.lecturer || "").toLowerCase();
            const direct = code.includes(qRaw) || name.includes(qRaw) || lecturer.includes(qRaw);
            if (!direct) {
              const normName = removeTones(name);
              const normLect = removeTones(lecturer);
              if (!normName.includes(qNorm) && !normLect.includes(qNorm)) {
                return false;
              }
            }
          }

          // Faculty filter
          if (faculty !== "ALL") {
            const fac = c.faculty;
            const matchFac = 
              fac === faculty ||
              (faculty === "CNTT" && (fac === "CNTT" || fac === "Khoa CNTT")) ||
              (faculty === "TOAN" && (fac === "TOAN" || fac === "Toán - Tin" || fac === "Khoa Toán - Tin")) ||
              (faculty === "NN" && (fac === "NN" || fac === "Ngoại ngữ" || fac === "Khoa Ngoại ngữ"));
            if (!matchFac) return false;
          }

          // Shift filter (Sáng: 1-5, Chiều: 6-11)
          if (shift !== "ALL") {
            const isMorning = c.shift === "MORNING" || c.shift === "Sáng" || (c.startPeriod != null && c.startPeriod <= 5);
            const isAfternoon = c.shift === "AFTERNOON" || c.shift === "Chiều" || (c.startPeriod != null && c.startPeriod >= 6);
            if (shift === "MORNING" && !isMorning) return false;
            if (shift === "AFTERNOON" && !isAfternoon) return false;
          }

          // Day filter (2 to 8, including Sunday / Day 8)
          if (day !== "ALL" && c.day.toString() !== day) {
            return false;
          }

          // Max credits slider
          if (c.credits > maxCredits) {
            return false;
          }

          // Conflict checkbox
          const isSelected = selectedIds.includes(c.id);
          if (onlyNonConflicting && !isSelected) {
            const hasConflict = selectedCourses.some(sel => checkIntervalConflict(c, sel));
            if (hasConflict) return false;
          }

          return true;
        });
      }, [courses, selectedCourses, selectedIds, search, faculty, shift, day, maxCredits, onlyNonConflicting]);

      const resetFilters = () => {
        setSearch("");
        setFaculty("ALL");
        setShift("ALL");
        setDay("ALL");
        setMaxCredits(maxPossibleCredits);
        setOnlyNonConflicting(false);
      };

      const isFilterActive = search !== "" || faculty !== "ALL" || shift !== "ALL" || day !== "ALL" || maxCredits < maxPossibleCredits || onlyNonConflicting;

      return (
        <section className="w-[28%] bg-white rounded-xl border border-slate-200 shadow-xs flex flex-col overflow-hidden">
          <div className="p-3.5 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <div>
              <h2 className="font-extrabold text-xs text-slate-900 uppercase tracking-wide flex items-center space-x-1.5">
                <i data-lucide="compass" className="w-4 h-4 text-blue-600"></i>
                <span>Khám Phá Học Phần (Course Explorer)</span>
              </h2>
              <p className="text-[11px] text-slate-500 mt-0.5">Tìm kiếm đa tiêu chí & Đăng ký trực tiếp</p>
            </div>
            {isFilterActive && (
              <button onClick={resetFilters} className="text-[11px] font-bold text-blue-600 hover:underline">
                Đặt lại
              </button>
            )}
          </div>

          {/* Filter Panel */}
          <div className="p-3.5 space-y-2.5 border-b border-slate-200 bg-white">
            <div className="relative">
              <i data-lucide="search" className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5"></i>
              <input 
                type="text" 
                value={search} 
                onChange={e => setSearch(e.target.value)} 
                placeholder="Tìm mã môn, tên môn hoặc giảng viên..." 
                className="w-full pl-8 pr-8 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-600"
              />
              {search && (
                <button 
                  onClick={() => setSearch("")} 
                  className="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 text-xs font-bold"
                  aria-label="Xóa từ khóa tìm kiếm"
                >
                  ✕
                </button>
              )}
            </div>

            <div className="grid grid-cols-2 gap-2 text-xs">
              <div>
                <label className="block text-[10px] font-bold text-slate-600 mb-0.5">Khoa / Bộ môn</label>
                <select value={faculty} onChange={e => setFaculty(e.target.value)} className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                  <option value="ALL">Tất cả khoa</option>
                  <option value="CNTT">Khoa CNTT</option>
                  <option value="TOAN">Khoa Toán - Tin</option>
                  <option value="NN">Khoa Ngoại ngữ</option>
                </select>
              </div>
              <div>
                <label className="block text-[10px] font-bold text-slate-600 mb-0.5">Ca học</label>
                <select value={shift} onChange={e => setShift(e.target.value)} className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                  <option value="ALL">Tất cả ca</option>
                  <option value="MORNING">Ca Sáng (1-5)</option>
                  <option value="AFTERNOON">Ca Chiều (6-11)</option>
                </select>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2 text-xs items-center">
              <div>
                <label className="block text-[10px] font-bold text-slate-600 mb-0.5">Ngày học</label>
                <select value={day} onChange={e => setDay(e.target.value)} className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                  <option value="ALL">Tất cả ngày (T2 - CN)</option>
                  <option value="2">Thứ Hai</option>
                  <option value="3">Thứ Ba</option>
                  <option value="4">Thứ Tư</option>
                  <option value="5">Thứ Năm</option>
                  <option value="6">Thứ Sáu</option>
                  <option value="7">Thứ Bảy</option>
                  <option value="8">Chủ Nhật</option>
                </select>
              </div>
              <div>
                <div className="flex justify-between items-center text-[10px] font-bold text-slate-600 mb-0.5">
                  <span>Số tín chỉ:</span>
                  <span className="text-blue-600 font-black">Tối đa {maxCredits} TC</span>
                </div>
                <input 
                  type="range" 
                  min="1" 
                  max={maxPossibleCredits} 
                  value={maxCredits} 
                  onChange={e => setMaxCredits(Number(e.target.value))} 
                  className="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                />
              </div>
            </div>

            <div className="pt-1 flex items-center justify-between text-xs">
              <label className="flex items-center space-x-2 cursor-pointer text-slate-700 select-none">
                <input 
                  type="checkbox" 
                  checked={onlyNonConflicting} 
                  onChange={e => setOnlyNonConflicting(e.target.checked)} 
                  className="rounded border-slate-300 text-blue-600 h-3.5 w-3.5"
                />
                <span className="text-[11px] font-medium">Chỉ hiện lớp không trùng lịch</span>
              </label>
              <span className={`text-[11px] font-bold ${filteredCourses.length > 0 ? 'text-slate-500' : 'text-amber-600'}`}>
                {filteredCourses.length} học phần
              </span>
            </div>
          </div>

          {/* Cards List / Empty State */}
          <div className="flex-1 overflow-y-auto p-3 space-y-2.5">
            {filteredCourses.length > 0 ? (
              filteredCourses.map(course => {
                const isSelected = selectedIds.includes(course.id);
                const isClashing = !isSelected && selectedCourses.some(sel => checkIntervalConflict(course, sel));
                return (
                  <CourseCard 
                    key={course.id}
                    course={course}
                    isSelected={isSelected}
                    isClashing={isClashing}
                    onAdd={onAdd}
                    onRemove={onRemove}
                    onOpenDetail={onOpenDetail}
                    onHoverEnter={onHoverEnter}
                    onHoverLeave={onHoverLeave}
                  />
                );
              })
            ) : (
              <div className="h-48 flex flex-col items-center justify-center text-center p-4 bg-slate-50/50 rounded-xl border border-dashed border-slate-200">
                <p className="font-bold text-xs text-slate-700">Không tìm thấy học phần phù hợp</p>
                <p className="text-[11px] text-slate-400 mt-1">Vui lòng thử từ khóa khác hoặc đặt lại bộ lọc tìm kiếm.</p>
                <button 
                  onClick={resetFilters} 
                  className="mt-3 px-3 py-1 bg-white border border-slate-200 hover:border-blue-300 text-blue-600 font-bold text-[11px] rounded-lg shadow-2xs transition"
                >
                  Đặt lại bộ lọc
                </button>
              </div>
            )}
          </div>
        </section>
      );
    }

    // ==================== COMPONENT: TIMETABLE CARD ====================
    function TimetableCourseCard({ course, isClashing, onClick }) {
      return (
        <div 
          onClick={() => onClick(course)}
          className={`h-full w-full rounded-lg p-1.5 flex flex-col justify-between text-left cursor-pointer transition shadow-2xs border ${
            isClashing 
              ? "bg-red-50 border-red-500 conflict-cell shake-alert" 
              : "bg-blue-50/90 border-blue-300 hover:border-blue-600"
          }`}
        >
          <div>
            <div className="flex items-center justify-between">
              <span className={`font-mono font-bold text-[9px] ${isClashing ? 'text-red-700' : 'text-blue-700'}`}>{course.code}</span>
              <span className="text-[8px] font-bold text-slate-500">{course.room}</span>
            </div>
            <h5 className="text-[10px] font-bold text-slate-900 line-clamp-1 leading-tight mt-0.5">{course.name}</h5>
          </div>
          <div className="flex items-center justify-between text-[8px] text-slate-400 mt-1">
            <span>{course.lecturer}</span>
            <span className="font-bold text-blue-700">{course.credits}TC</span>
          </div>

    // ==================== COMPONENT: WEEKLY TIMETABLE ====================
    function WeeklyTimetable(props) {
      var courses = props.courses;
      var selectedIds = props.selectedIds;
      var ghostCourse = props.ghostCourse;
      var conflict = props.conflict;
      var activePlan = props.activePlan || "plan_1";
      var onPlanChange = props.onPlanChange;
      var onCourseClick = props.onCourseClick;
      var onResetToDefault = props.onResetToDefault;
      var _weekState = useState(1);
      var currentWeek = _weekState[0];
      var setCurrentWeek = _weekState[1];
      var weekLabels = {
        1: "Tuần 01: 28/09 - 04/10/2026",
        2: "Tuần 02: 05/10 - 11/10/2026",
        3: "Tuần 03: 12/10 - 18/10/2026",
        4: "Tuần 04: 19/10 - 25/10/2026"
      };
      const activeCourses = useMemo(() => {
        return courses.filter(c => selectedIds.includes(c.id));
      }, [courses, selectedIds]);

      const days = [2, 3, 4, 5, 6, 7, 8];
      const dayNames = ["Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy", "Chủ Nhật"];

      const slots = [
        { id: "p1", slotId: "slot_1_3", label: "Tiết 1 - 3", time: "07:00 - 09:25", shift: "Sáng", start: 1, end: 3 },
        { id: "p2", slotId: "slot_4_5", label: "Tiết 4 - 5", time: "09:35 - 11:10", shift: "Sáng", start: 4, end: 5 },
        { id: "p3", slotId: "slot_7_9", label: "Tiết 7 - 9", time: "12:45 - 15:10", shift: "Chiều", start: 7, end: 9 },
        { id: "p4", slotId: "slot_10_11", label: "Tiết 10 - 11", time: "15:20 - 16:55", shift: "Chiều", start: 10, end: 11 }
      ];

      return (
        <section className="w-[47%] bg-white rounded-xl border border-slate-200 shadow-xs flex flex-col overflow-hidden">
          {/* Toolbar */}
          <div className="p-3 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="flex items-center space-x-1.5">
                <i data-lucide="calendar-days" className="w-4 h-4 text-blue-600"></i>
                <span className="font-extrabold text-xs text-slate-900 uppercase tracking-wide">Thời Khóa Biểu Tuần (Weekly Timetable)</span>
              </div>
              <div className="flex items-center bg-white border border-slate-200 rounded-lg px-2 py-0.5 text-xs shadow-2xs">
                <button className="p-1 hover:text-blue-600"><i data-lucide="chevron-left" className="w-3.5 h-3.5"></i></button>
                <span className="px-2 font-bold text-[11px] text-slate-800">Tuần 01: 29/09 - 05/10/2026</span>
                <button className="p-1 hover:text-blue-600"><i data-lucide="chevron-right" className="w-3.5 h-3.5"></i></button>
              </div>
            </div>

            <button onClick={onResetToDefault} className="text-[11px] font-bold text-blue-600 hover:underline">
              Khôi phục mặc định
            </button>
          </div>

          {/* Matrix Grid */}
          <div className="flex-1 flex flex-col overflow-hidden bg-white">
            {/* Header row */}
            <div className="grid grid-cols-8 bg-slate-50 border-b border-slate-200 text-center py-2 text-[11px] font-bold text-slate-700 shrink-0">
              <div className="text-slate-400 border-r border-slate-200">Tiết / Giờ</div>
              {dayNames.map((name, idx) => (
                <div key={idx} className={idx < 6 ? "border-r border-slate-200" : ""}>{name}</div>
              ))}
            </div>

            {/* Matrix body */}
            <div className="flex-1 grid grid-rows-4 divide-y divide-slate-200 overflow-hidden">
              {slots.map(slot => (
                <div key={slot.id} className="grid grid-cols-8 h-full">
                  <div className="p-1.5 bg-slate-50/60 border-r border-slate-200 flex flex-col justify-center items-center text-center">
                    <span className="font-extrabold text-[11px] text-slate-800">{slot.label}</span>
                    <span className="text-[9px] text-slate-500 font-mono">{slot.time}</span>
                    <span className="text-[8px] font-bold text-blue-600 bg-blue-50 px-1 rounded mt-0.5">{slot.shift}</span>
                  </div>

                  {days.map(d => {
                    const enrolled = activeCourses.find(c => c.day === d && (c.periodSlot === slot.id || c.periodSlot === slot.slotId || (c.startPeriod <= slot.end && c.endPeriod >= slot.start)));
                    const isGhostMatch = ghostCourse && ghostCourse.day === d && (ghostCourse.periodSlot === slot.id || ghostCourse.periodSlot === slot.slotId || (ghostCourse.startPeriod <= slot.end && ghostCourse.endPeriod >= slot.start));
                    const isGhostPreview = isGhostMatch && !selectedIds.includes(ghostCourse.id);
                    const isGhostConflict = isGhostPreview && enrolled && enrolled.id !== ghostCourse.id;
                    const isHoveringEnrolled = isGhostMatch && enrolled && enrolled.id === ghostCourse.id;
                    const isClashing = enrolled && conflict && (conflict.incomingCourse.id === enrolled.id || conflict.existingCourse.id === enrolled.id);

                    return (
                      <div key={d} className={`p-1 relative flex flex-col justify-center ${d < 8 ? "border-r border-slate-200" : "bg-slate-50/20"}`}>
                        {enrolled ? (
                          <div className={`relative h-full w-full rounded-lg transition-all ${
                            isGhostConflict ? "ring-2 ring-red-500 animate-pulse" : isHoveringEnrolled ? "ring-2 ring-blue-500 shadow-md" : ""
                          }`}>
                            <TimetableCourseCard course={enrolled} isClashing={isClashing || isGhostConflict} onClick={onCourseClick} />
                            {isGhostConflict && (
                              <div className="absolute -top-1.5 -right-1 bg-red-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow pointer-events-none z-20 flex items-center space-x-0.5">
                                <span>⚠️ Trùng {ghostCourse.code}</span>
                              </div>
                            )}
                          </div>
                        ) : isGhostPreview ? (
                          <div className={`h-full w-full rounded-lg p-1.5 flex flex-col justify-between text-left pointer-events-none transition-all duration-150 border-2 border-dashed ${
                            ghostCourse.status === 'ineligible' 
                              ? "border-slate-400 bg-slate-100/80" 
                              : "border-blue-500 bg-blue-50/70 animate-pulse"

        // ==================== RFC 5545 ICALENDAR EXPORT HELPER ====================
    function downloadICalendarFile(courses, filename) {
      filename = filename || "ThoiKhoaBieu_ICRA_ICTU.ics";
      var periodTimes = {
        1: { start: "070000", end: "074500" },
        2: { start: "075000", end: "083500" },
        3: { start: "084000", end: "092500" },
        4: { start: "093500", end: "102000" },
        5: { start: "102500", end: "111000" },
        6: { start: "120000", end: "124500" },
        7: { start: "124500", end: "133000" },
        8: { start: "133500", end: "142000" },
        9: { start: "142500", end: "151000" },
        10: { start: "152000", end: "160500" },
        11: { start: "161000", end: "165500" }
      };
      var now = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      var getFirstDate = function(day) {
        var base = new Date(Date.UTC(2026, 8, 28));
        var offset = (day >= 2 && day <= 8) ? day - 2 : 0;
        base.setUTCDate(base.getUTCDate() + offset);
        var y = base.getUTCFullYear();
        var m = String(base.getUTCMonth() + 1).padStart(2, "0");
        var d = String(base.getUTCDate()).padStart(2, "0");
        return "" + y + m + d;
      };
      var events = courses.map(function(c) {
        var dStr = getFirstDate(c.day);
        var sP = c.startPeriod || 1;
        var eP = c.endPeriod || 3;
        var st = (periodTimes[sP] && periodTimes[sP].start) || "070000";
        var et = (periodTimes[eP] && periodTimes[eP].end) || "092500";
        return [
          "BEGIN:VEVENT",
          "UID:ICRA-" + c.id + "-2026@ictu.edu.vn",
          "DTSTAMP:" + now,
          "DTSTART:" + dStr + "T" + st,
          "DTEND:" + dStr + "T" + et,
          "RRULE:FREQ=WEEKLY;UNTIL=20270115T235959Z",
          "SUMMARY:[ICRA] " + c.code + " - " + c.name,
          "DESCRIPTION:Học phần: " + c.name + "\\nGiảng viên: " + c.lecturer + "\\nSố TC: " + c.credits + " TC\\nThời gian: " + c.scheduleText + " (" + c.timeText + ")",
          "LOCATION:" + (c.room || c.classroom || "ICTU Campus"),
          "STATUS:CONFIRMED",
          "END:VEVENT"
        ].join("\r\n");
      }).join("\r\n");
      var ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//ICTU//ICRA Intelligent Course Registration Assistant//VI",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "X-WR-CALNAME:Thời khóa biểu ICRA ICTU 2026-2027",
        "X-WR-TIMEZONE:Asia/Ho_Chi_Minh",
        events,
        "END:VCALENDAR"
      ].join("\r\n");
      var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

                <i data-lucide="arrow-right" className="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== COMPONENT: TOAST NOTIFICATIONS ====================
    function ToastContainer({ toasts, onDismiss }) {
      return (
        <div className="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none">
          {toasts.map(t => (
            <div 
              key={t.id} 
              className={`pointer-events-auto p-3.5 rounded-xl shadow-xl border flex items-start space-x-3 text-xs w-80 animate-in slide-in-from-right duration-200 ${
                t.type === 'error' ? 'bg-red-50 border-red-200 text-red-900' : 
                t.type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-900' :
                'bg-white border-slate-200 text-slate-800'
              }`}
            >
              <div className="shrink-0 mt-0.5">
                {t.type === 'error' ? '⚠️' : t.type === 'warning' ? '⚡' : '✅'}
              </div>
              <div className="flex-1">
                <h5 className="font-bold">{t.title}</h5>
                <p className="text-[11px] text-slate-500 mt-0.5">{t.message}</p>
              </div>
              <button onClick={() => onDismiss(t.id)} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>
          ))}
        </div>
      );
    }

    // ==================== MAIN ROOT APP ====================
    function App() {
      const [courses, setCourses] = useState(INITIAL_COURSES);
      const [selectedIds, setSelectedIds] = useState(["CS101", "CS201", "MATH101", "ENG101"]);
      const [ghostCourse, setGhostCourse] = useState(null);
      const [conflict, setConflict] = useState(null);
      const [selectedDetailCourse, setSelectedDetailCourse] = useState(null);
      const [isReviewOpen, setIsReviewOpen] = useState(false);
      const [isReceiptOpen, setIsReceiptOpen] = useState(false);
      const [toasts, setToasts] = useState([]);

      const addToast = (type, title, message) => {
        const id = Math.random().toString();
        setToasts(prev => [...prev, { id, type, title, message }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      const checkIntervalConflict = (a, b) => {
        if (a.id === b.id) return false;
        if (a.day !== b.day) return false;
        if (a.startPeriod != null && a.endPeriod != null && b.startPeriod != null && b.endPeriod != null) {
          return a.startPeriod <= b.endPeriod && a.endPeriod >= b.startPeriod;
        }
        if (a.periodSlot && b.periodSlot) {
          return a.periodSlot === b.periodSlot;
        }
        return a.periodText === b.periodText;
      };

      const handleAddCourse = (course) => {
        // Detect Collision via interval math
        const clash = courses.find(x => selectedIds.includes(x.id) && checkIntervalConflict(course, x));
        if (clash) {
          setConflict({ incomingCourse: course, existingCourse: clash });
          addToast('error', 'Xung đột lịch học!', `Lớp ${course.code} bị trùng lịch Thứ ${course.day} với môn ${clash.code}.`);
          return;
        }

        if (!selectedIds.includes(course.id)) {
          setSelectedIds(prev => [...prev, course.id]);
          setConflict(null);
          addToast('success', 'Đã thêm học phần', `Đã thêm ${course.name} (${course.code}) vào thời khóa biểu.`);
        }
      };

      const handleRemoveCourse = (courseId) => {
        setSelectedIds(prev => prev.filter(id => id !== courseId));
        setConflict(null);
        addToast('info', 'Đã bỏ chọn học phần', 'Đã xóa học phần khỏi thời khóa biểu.');
      };

      const handleResolveConflict = () => {
        setConflict(null);
        if (!selectedIds.includes("CS202-01")) {
          setSelectedIds(prev => [...prev, "CS202-01"]);
          addToast('success', 'Đã giải quyết xung đột', 'Hệ thống tự động chuyển sang lớp CS202-01 (Chiều Thứ Năm).');
        }
      };

      const handleAddAiCourse = () => {
        if (!selectedIds.includes("CS202-01")) {
          setSelectedIds(prev => [...prev, "CS202-01"]);
          addToast('success', 'AI Recommendation', 'Đã thêm học phần đề xuất CS202: Thiết kế UI/UX vào TKB!');
        }
      };

      const handleResetDefault = () => {
        setSelectedIds(["CS101", "CS201", "MATH101", "ENG101"]);
        setConflict(null);
        addToast('info', 'Khôi phục lịch học', 'Đã đặt lại thời khóa biểu về 4 môn tiêu chuẩn.');
      };

      const handleConfirmRegistration = () => {
        setIsReviewOpen(false);
        confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
        setIsReceiptOpen(true);
      };

      useEffect(() => {
        lucide.createIcons();
      });

      return (
        <div className="h-full flex flex-col overflow-hidden">
          <Header student={STUDENT} />

          <ConflictAlert 
            conflict={conflict} 
            onResolve={handleResolveConflict} 
            onDismiss={() => setConflict(null)} 
          />

          <main className="flex-1 flex gap-3.5 p-3.5 overflow-hidden w-full max-w-[1920px] mx-auto">
            <CourseExplorer 
              courses={courses}
              selectedIds={selectedIds}
              onAdd={handleAddCourse}
              onRemove={handleRemoveCourse}
              onOpenDetail={setSelectedDetailCourse}
              onHoverEnter={setGhostCourse}
              onHoverLeave={() => setGhostCourse(null)}
            />

            <WeeklyTimetable 
              courses={courses}
              selectedIds={selectedIds}
              ghostCourse={ghostCourse}
              conflict={conflict}
              onCourseClick={setSelectedDetailCourse}
              onResetToDefault={handleResetDefault}
            />

            <RegistrationSummary 
              courses={courses}
              selectedIds={selectedIds}
              onRemove={handleRemoveCourse}
              onAddAiCourse={handleAddAiCourse}
              onOpenReviewModal={() => setIsReviewOpen(true)}
              hasConflict={Boolean(conflict)}
            />
          </main>

                    <CourseDetailModal
            course={selectedDetailCourse}
            isSelected={Boolean(selectedDetailCourse && selectedIds.includes(selectedDetailCourse.id))}
            isClashing={Boolean(selectedDetailCourse && courses.filter(function(c) { return selectedIds.includes(c.id); }).some(function(sel) { return checkIntervalConflict(selectedDetailCourse, sel); }))}
            onClose={function() { setSelectedDetailCourse(null); }}
            onAdd={handleAddCourse}
            onRemove={handleRemoveCourse}
          />

          <ConfirmationModal 
            isOpen={isReviewOpen}
            onClose={() => setIsReviewOpen(false)}
            onConfirm={handleConfirmRegistration}
            student={STUDENT}
            courses={courses}
            selectedIds={selectedIds}
          />

          {/* Receipt Modal */}
          {isReceiptOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl space-y-5 text-center border border-slate-100 animate-in fade-in zoom-in duration-200">
                <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mx-auto shadow-sm">
                  ✓
                </div>
                <div className="space-y-1">
                  <span className="bg-emerald-50 text-emerald-700 font-extrabold text-[10px] px-3 py-1 rounded-full uppercase tracking-wider border border-emerald-200">
                    Giao dịch thành công
                  </span>
                  <h3 className="text-xl font-black text-slate-900 tracking-tight pt-1">ĐĂNG KÝ HỌC KỲ HOÀN TẤT!</h3>
                  <p className="text-xs font-mono text-slate-400">Mã biên lai điện tử: #ICRA-2026-9812-ICTU</p>
                </div>
                <div className="bg-slate-50 rounded-2xl p-4 text-xs space-y-2 text-left border border-slate-200">
                  <div className="flex justify-between">
                    <span className="text-slate-500">Thời gian ghi nhận:</span>
                    <span className="font-bold text-slate-800">22:30:15 - 28/09/2026</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Tổng tín chỉ:</span>
                    <span className="font-black text-blue-600">
                      {courses.filter(c => selectedIds.includes(c.id)).reduce((s, c) => s + c.credits, 0)} Tín chỉ
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Tình trạng học phí:</span>
                    <span className="font-bold text-amber-600">Chờ nộp qua ngân hàng</span>
                  </div>
                </div>
                <div className="space-y-2 pt-2">
                  <button onClick={() => { downloadICalendarFile(courses.filter(function(c) { return selectedIds.includes(c.id); }), 'ThoiKhoaBieu_ICRA_ICTU.ics'); addToast('success', 'Xuất lịch học', 'Đã tải xuống file ThoiKhoaBieu_ICRA_ICTU.ics thành công!'); }} className="w-full py-2.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5">
                    <i data-lucide="calendar" className="w-4 h-4"></i>
                    <span>Đồng Bộ Google Calendar / Tải File .ICS</span>
                  </button>
                  <button onClick={() => setIsReceiptOpen(false)} className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition">
                    Hoàn tất & Về Bàn Làm Việc
                  </button>
                </div>
              </div>
            </div>
          )}

          <ToastContainer toasts={toasts} onDismiss={(id) => setToasts(prev => prev.filter(t => t.id !== id))} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
